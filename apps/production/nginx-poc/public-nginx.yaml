apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-nginx
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: public-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.29-alpine
        ports:
        - name: http
          containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: public-nginx
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: public-nginx
  ports:
  - name: http
    port: 80
    targetPort: http

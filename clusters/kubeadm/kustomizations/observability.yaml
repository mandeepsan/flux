apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  dependsOn:
  - name: infrastructure-sources
  - name: infrastructure-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./observability
  prune: true
  wait: true
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: alloy
    namespace: monitoring
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: loki
    namespace: monitoring
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: prometheus-stack
    namespace: monitoring
  decryption:
    provider: sops
    secretRef:
      name: sops-aws-kms
  sourceRef:
    kind: GitRepository
    name: flux-system

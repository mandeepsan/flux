apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  dependsOn:
  - name: infrastructure-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./observability
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-aws-kms
  sourceRef:
    kind: GitRepository
    name: flux-system

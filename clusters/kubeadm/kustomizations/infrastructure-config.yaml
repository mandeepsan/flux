apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-config
  namespace: flux-system
spec:
  dependsOn:
  - name: infrastructure-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system

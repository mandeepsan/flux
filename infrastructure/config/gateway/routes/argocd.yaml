apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: networking
spec:
  parentRefs:
  - name: otroid-gateway
    sectionName: https-wildcard-otroid-net
  hostnames:
  - argo.otroid.net
  rules:
  - backendRefs:
    - name: argocd-server
      namespace: argocd
      port: 80

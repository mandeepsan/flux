apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3-buckets
  namespace: networking
spec:
  parentRefs:
  - name: otroid-gateway
    sectionName: https-wildcard-s3-otroid-net
  hostnames:
  - "*.s3.otroid.net"
  rules:
  - backendRefs:
    - name: seaweedfs-s3
      namespace: storage
      port: 8333

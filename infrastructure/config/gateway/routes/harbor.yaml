apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: networking
spec:
  parentRefs:
  - name: otroid-gateway
    sectionName: https-wildcard-otroid-net
  hostnames:
  - harbor.otroid.net
  rules:
  - backendRefs:
    - name: harbor
      namespace: harbor
      port: 80

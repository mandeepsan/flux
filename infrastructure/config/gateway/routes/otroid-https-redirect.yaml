apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otroid-https-redirect
  namespace: networking
spec:
  parentRefs:
  - name: otroid-gateway
    sectionName: http-wildcard-otroid-net
  hostnames:
  - "*.otroid.net"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301

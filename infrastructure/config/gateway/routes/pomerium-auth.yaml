apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pomerium-auth
  namespace: networking
spec:
  parentRefs:
  - name: otroid-gateway
    sectionName: https-wildcard-otroid-net
  hostnames:
  - auth.otroid.net
  rules:
  - backendRefs:
    - name: pomerium-proxy
      port: 80

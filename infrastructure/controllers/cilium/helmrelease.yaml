apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: cilium
      version: 1.19.5
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  values:
    autoDirectNodeRoutes: true
    bandwidthManager:
      bbr: true
      enabled: true
    bpf:
      lbMapMax: 131072
      masquerade: true
    devices: eth0
    envoy:
      enabled: true
      securityContext:
        capabilities:
          envoy:
          - NET_ADMIN
          - SYS_ADMIN
          - NET_BIND_SERVICE
          keepCapNetBindService: true
    gatewayAPI:
      enabled: true
      hostNetwork:
        enabled: true
    hubble:
      metrics:
        dashboards:
          enabled: true
        enabled:
        - dns
        - drop
        - tcp
        - flow
        - port-distribution
        - icmp
        - http
        serviceMonitor:
          enabled: true
          labels:
            release: prometheus-stack
      relay:
        enabled: true
      ui:
        enabled: true
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 10.244.0.0/16
    k8s:
      requireIPv4PodCIDR: true
    k8sServiceHost: 159.195.203.230
    k8sServicePort: 6443
    kubeProxyReplacement: true
    loadBalancer:
      acceleration: best-effort
      mode: snat
    operator:
      prometheus:
        enabled: true
        metricsService: true
        serviceMonitor:
          enabled: true
          labels:
            release: prometheus-stack
      replicas: 1
    prometheus:
      enabled: true
      metricsService: true
      serviceMonitor:
        enabled: true
        labels:
          release: prometheus-stack
    routingMode: native
    tunnelProtocol: vxlan

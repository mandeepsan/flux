apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pomerium
  namespace: networking
spec:
  interval: 5m
  chart:
    spec:
      chart: pomerium
      version: 34.0.1
      sourceRef:
        kind: HelmRepository
        name: pomerium
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  driftDetection:
    mode: enabled
  values:
    config:
      rootDomain: otroid.net
      insecure: true
    authenticate:
      name: auth
      idp:
        provider: oidc
        url: https://id.otroid.net
        scopes: openid profile email groups
    ingress:
      enabled: false
    redis:
      enabled: false
  valuesFrom:
  - kind: Secret
    name: pomerium-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: pomerium-routes
    valuesKey: values.yaml

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sm-operator
  namespace: sm-operator-system
spec:
  interval: 5m
  chart:
    spec:
      chart: sm-operator
      version: 2.0.3
      sourceRef:
        kind: HelmRepository
        name: bitwarden
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  driftDetection:
    mode: enabled
  values:
    settings:
      bwSecretsManagerRefreshInterval: 300
      cloudRegion: US
      replicas: 1
